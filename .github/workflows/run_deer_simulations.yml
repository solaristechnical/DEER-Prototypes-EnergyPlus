name: Run DEER simulations

run-name: >-
  Run by @${{ github.actor }} from ${{ inputs.model_ref }}
  using ${{ inputs.run_profile }} profile
  in ${{ inputs.measure_path }}

on:
  workflow_dispatch:
    inputs:
      model_ref:
        description: Git branch, tag, or SHA
        required: true
        type: string
      measure_path:
        description: "Repository-relative path to the measure folder"
        required: true
        type: string
      run_profile:
        description: "Requested compute profile"
        required: true
        type: choice
        options:
          - test
          - standard
          - large
      simulate:
        description: "Simulate models after compose"
        required: false
        type: boolean
        default: false
      keep_running: {description: "Do not stop instance after run",  type: boolean, default: false}

concurrency:
  group: ec2-server5
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  start-cloud:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SIMULATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Start simulation instance
        run: |
          aws ec2 start-instances \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}"

          aws ec2 wait instance-running \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}"

      - name: Wait for SSM ping
        id: ssm
        run: |
          for attempt in {1..12}; do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ vars.SIMULATION_INSTANCE_ID }}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)
            echo "SSM status: $STATUS"
            [[ "$STATUS" == "Online" ]] && exit 0
            sleep 5
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Cloud server startup summary" >> $GITHUB_STEP_SUMMARY
          echo " - Simulation instance ID ${{ vars.SIMULATION_INSTANCE_ID }}"
          echo " - SSM ping status ${{ steps.ssm.outcome }}"

  package-qc:
    needs: start-cloud
    runs-on: ubuntu-latest
    outputs:
      s3bucket: s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}
      start_date: ${{ steps.gitinfo.outputs.start_date }}
      sha: ${{ steps.gitinfo.outputs.sha }}
    steps:
      # Checkout the model repository at the specified ref (branch, tag, or SHA)
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.model_ref }}
          path: model_repo

      - name: Capture commit SHA
        id: gitinfo
        shell: bash
        run: |
          cd model_repo
          echo "start_date=$(date)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Validate measure path
        shell: bash
        run: |
          cd model_repo
          test -d "${{ inputs.measure_path }}"
          case "${{ inputs.measure_path }}" in
            "commercial measures/"*|"residential measures/"*) ;;
            *) echo "Invalid measure path"; exit 1 ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SIMULATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Send command to server
        id: sendCommand
        shell: bash
        run: |
          # The bootstrap script downloads the simulation script and then launches it.
          COMMAND="pwsh 'C:/DEER/deer-cloud-compute-setup/workflow/BootstrapSimulation.ps1'"
          COMMAND+=" -RunId '${{ github.run_id }}'"
          COMMAND+=" -Repository '${{ github.repository }}'"
          COMMAND+=" -CommitSha '${{ steps.gitinfo.outputs.sha }}'"
          COMMAND+=" -MeasurePath '${{ inputs.measure_path }}'"
          COMMAND+=" -S3Bucket '${{ vars.SIMULATION_BUCKET }}'"
          COMMAND+=" -RunAttempt '${{ github.run_attempt }}'"
          COMMAND+=" -RequestedSteps 'package-qc'"
          echo "COMMAND=$COMMAND"
          PARAMS=$(jq -nc --arg command "$COMMAND" '{commands:[$command]}')
          echo "PARAMS=$PARAMS"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "$PARAMS" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true,CloudWatchLogGroupName="/aws/ssm/githubactions" \
            --query 'Command.CommandId' \
            --output text \
            )
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "### Measure QC task submitted" >> $GITHUB_STEP_SUMMARY
          echo "- Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit SHA: ${{ steps.gitinfo.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Measure path: ${{ inputs.measure_path }}" >> $GITHUB_STEP_SUMMARY
          echo "- SSM Command ID: $COMMAND_ID" >> $GITHUB_STEP_SUMMARY
          echo "- S3 archive: \`s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Log file: s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}/attempt-${{ github.run_attempt }}/transcript_package-qc.log" >> $GITHUB_STEP_SUMMARY

      - name: Wait for commands to complete
        shell: bash
        run: |
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "${{ vars.SIMULATION_INSTANCE_ID }}" \
              --command-id "${{ steps.sendCommand.outputs.command_id }}" \
              --query "Status" \
              --output text)
            echo "Current status: $STATUS"
            if [[ "$STATUS" == "Failed" ]]; then
                echo "SSM command failed"
                exit 1
            fi
            if [[ "$STATUS" == "Cancelled" ]]; then
                echo "SSM command cancelled"
                exit 1
            fi
            if [[ "$STATUS" == "Success" ]]; then
                break
            fi
            sleep 30
          done

      - name: Download status file
        shell: bash
        run: |
          echo "Waiting for step-status.json..."
          for i in {1..10}; do
            aws s3 cp \
              "s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}/steps/package-qc/step-status.json" \
              step-status.json && break
            sleep 10
          done
          test -s step-status.json

      - name: Validate status
        shell: bash
        run: |
          STATUS=$(jq -r .Status step-status.json)

          if [[ "$STATUS" != "Success" ]]; then
            echo "Simulation failed"
            cat step-status.json
            exit 1
          fi

      - name: Download QC artifacts from S3
        id: download-artifacts
        shell: bash
        run: |
          # Define a function to download required artifacts from S3 with retries
          download_required() {
            local source="$1"
            local destination="$2"
            local base_s3_path="s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}"

            mkdir -p "$(dirname "$destination")"

            for attempt in {1..10}; do  
              if aws s3 cp "${base_s3_path}/${source}" "$destination"; then
                test -s "$destination" && return 0
              fi
              echo "Waiting for $(basename "$destination")..."
              sleep 10
            done

            echo "::error::Required artifact was not available: $source"
            return 1
          }
          download_required "attempt-${{ github.run_attempt }}/transcript_package-qc.log" "transcript_package-qc.log"
          download_required "outputs/package-qc/measure-qc.json" "outputs/measure-qc.json"
          download_required "outputs/package-qc/measure-qc.md" "outputs/measure-qc.md"
          download_required "outputs/package-qc/scenario-index.json" "outputs/scenario-index.json"
          test -s "transcript_package-qc.log"
          test -s "outputs/measure-qc.json"
          test -s "outputs/measure-qc.md"
          test -s "outputs/scenario-index.json"

      - name: Upload artifacts bundle
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-qc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            transcript_package-qc.log
            step-status.json
            outputs/*
          if-no-files-found: error
          retention-days: 30
      
      - name: Upload measure-qc.json
        id: upload-measure-qc-json
        uses: actions/upload-artifact@v7
        with:
          name: measure-qc.json
          path: outputs/measure-qc.json
          if-no-files-found: error
          retention-days: 30
          archive: false
      - name: Upload measure-qc.md
        id: upload-measure-qc-md
        uses: actions/upload-artifact@v7
        with:
          name: measure-qc.md
          path: outputs/measure-qc.md
          if-no-files-found: error
          retention-days: 30
          archive: false
      - name: Upload scenario-index.json
        id: upload-scenario-index-json
        uses: actions/upload-artifact@v7
        with:
          name: scenario-index.json
          path: outputs/scenario-index.json
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Add summary
        shell: bash
        run: |
          STATUS=$(jq -r .Status step-status.json)
          echo "### Measure definition QC task status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "- Runtime (seconds): $(jq -r .RunTimeSeconds step-status.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Task status: $(jq -r .Status step-status.json)" >> $GITHUB_STEP_SUMMARY
          if [[ "$STATUS" != "Success" ]]; then
            echo "- Failure message: $(jq -r .FailureMessage step-status.json)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### QC results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ ${{ steps.download-artifacts.outcome }} == "success" ]]; then
            cat outputs/measure-qc.md >> $GITHUB_STEP_SUMMARY
          else
            echo "QC results not available." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "### Downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "- [measure-qc.json](${{ steps.upload-measure-qc-json.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- [measure-qc.md](${{ steps.upload-measure-qc-md.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- [scenario-index.json](${{ steps.upload-scenario-index-json.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Additional debug info - [package-qc.zip](${{ steps.upload-artifacts.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  compose:
    needs: package-qc
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SIMULATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Send command to server
        id: sendCommand
        shell: bash
        run: |
          # The bootstrap script downloads the simulation script and then launches it.
          COMMAND="pwsh 'C:/DEER/deer-cloud-compute-setup/workflow/BootstrapSimulation.ps1'"
          COMMAND+=" -RunId '${{ github.run_id }}'"
          COMMAND+=" -Repository '${{ github.repository }}'"
          COMMAND+=" -CommitSha '${{ needs.package-qc.outputs.sha }}'"
          COMMAND+=" -MeasurePath '${{ inputs.measure_path }}'"
          COMMAND+=" -S3Bucket '${{ vars.SIMULATION_BUCKET }}'"
          COMMAND+=" -RunAttempt '${{ github.run_attempt }}'"
          COMMAND+=" -RequestedSteps 'compose'"
          echo "COMMAND=$COMMAND"
          PARAMS=$(jq -nc --arg command "$COMMAND" '{commands:[$command]}')
          echo "PARAMS=$PARAMS"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "$PARAMS" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true,CloudWatchLogGroupName="/aws/ssm/githubactions" \
            --query 'Command.CommandId' \
            --output text \
            )
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "## Compose models summary" >> $GITHUB_STEP_SUMMARY
          echo "- SSM Command ID: $COMMAND_ID" >> $GITHUB_STEP_SUMMARY
          echo "- Log file: s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}/attempt-${{ github.run_attempt }}/transcript_compose.log" >> $GITHUB_STEP_SUMMARY
          
      - name: Wait for commands to complete
        shell: bash
        run: |
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "${{ vars.SIMULATION_INSTANCE_ID }}" \
              --command-id "${{ steps.sendCommand.outputs.command_id }}" \
              --query "Status" \
              --output text)
            echo "Current status: $STATUS"
            if [[ "$STATUS" == "Failed" ]]; then
                echo "SSM command failed"
                exit 1
            fi
            if [[ "$STATUS" == "Cancelled" ]]; then
                echo "SSM command cancelled"
                exit 1
            fi
            if [[ "$STATUS" == "Success" ]]; then
                break
            fi
            sleep 30
          done

      - name: Download status file
        shell: bash
        run: |
          for i in {1..10}; do
            if aws s3 cp \
              "s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}/steps/compose/step-status.json" \
              step-status.json
            then
              break
            fi

            echo "Waiting for status.json..."
            sleep 10
          done

      - name: Validate status
        shell: bash
        run: |
          STATUS=$(jq -r .Status step-status.json)

          if [[ "$STATUS" != "Success" ]]; then
            echo "Simulation failed"
            cat step-status.json
            exit 1
          fi

      - name: Download artifacts from S3
        id: download-artifacts
        shell: bash
        run: |
          # Define a function to download required artifacts from S3 with retries
          download_required() {
            local source="$1"
            local destination="$2"
            local base_s3_path="s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}"
            mkdir -p "$(dirname "$destination")"

            for attempt in {1..10}; do
              if aws s3 cp "${base_s3_path}/${source}" "$destination"; then
                test -s "$destination" && return 0
              fi
              echo "Waiting for $(basename "$destination")..."
              sleep 10
            done

            echo "::error::Required artifact was not available: $source"
            return 1
          }
          # Download the transcript for this step
          download_required \
            "attempt-${{ github.run_attempt }}/transcript_compose.log" \
            "transcript_compose.log"
          # Download scenario-index.json from the package-qc step outputs
          download_required \
            "outputs/package-qc/scenario-index.json" \
            "scenario-index.json"

          # Iterate over scenarios from scenario index
          # Scenario index is just an unnamed list of dictionaries, each element representing a scenario with element scenarioId
          # scenarioId is a folder name that may include spaces.
          while IFS= read -r scenario; do
            echo "Fetching scenario: $scenario"
            download_required \
              "outputs/compose/${scenario}/compose.log" \
              "outputs/compose/${scenario}-compose.log"
          done < <(jq -r '.[].scenarioId' scenario-index.json)

      - name: Upload artifacts to Github
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compose-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            step-status.json
            transcript_compose.log
            outputs/compose/*-compose.log
          if-no-files-found: error
          retention-days: 30

      - name: Add summary
        shell: bash
        run: |
          STATUS=$(jq -r .Status step-status.json)
          echo "## Compose task status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime (seconds): $(jq -r .RunTimeSeconds step-status.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $(jq -r .Status step-status.json)" >> $GITHUB_STEP_SUMMARY
          if [[ "$STATUS" != "Success" ]]; then
            echo "- Failure message: $(jq -r .FailureMessage step-status.json)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Compose logs](${{ steps.upload-artifacts.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  compose-qc:
    needs: [package-qc, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SIMULATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Send command to server
        id: sendCommand
        shell: bash
        run: |
          # The bootstrap script downloads the simulation script and then launches it.
          COMMAND="pwsh 'C:/DEER/deer-cloud-compute-setup/workflow/BootstrapSimulation.ps1'"
          COMMAND+=" -RunId '${{ github.run_id }}'"
          COMMAND+=" -Repository '${{ github.repository }}'"
          COMMAND+=" -CommitSha '${{ needs.package-qc.outputs.sha }}'"
          COMMAND+=" -MeasurePath '${{ inputs.measure_path }}'"
          COMMAND+=" -S3Bucket '${{ vars.SIMULATION_BUCKET }}'"
          COMMAND+=" -RunAttempt '${{ github.run_attempt }}'"
          COMMAND+=" -RequestedSteps 'compose-qc'"
          echo "COMMAND=$COMMAND"
          PARAMS=$(jq -nc --arg command "$COMMAND" '{commands:[$command]}')
          echo "PARAMS=$PARAMS"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "$PARAMS" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true,CloudWatchLogGroupName="/aws/ssm/githubactions" \
            --query 'Command.CommandId' \
            --output text \
            )
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "## Compose QC task submitted" >> $GITHUB_STEP_SUMMARY
          echo "- SSM Command ID: $COMMAND_ID" >> $GITHUB_STEP_SUMMARY
          
      - name: Wait for commands to complete
        shell: bash
        run: |
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "${{ vars.SIMULATION_INSTANCE_ID }}" \
              --command-id "${{ steps.sendCommand.outputs.command_id }}" \
              --query "Status" \
              --output text)
            echo "Current status: $STATUS"
            if [[ "$STATUS" == "Failed" ]]; then
                echo "SSM command failed"
                exit 1
            fi
            if [[ "$STATUS" == "Cancelled" ]]; then
                echo "SSM command cancelled"
                exit 1
            fi
            if [[ "$STATUS" == "Success" ]]; then
                break
            fi
            sleep 30
          done

      - name: Download status file
        shell: bash
        run: |
          for i in {1..10}; do
            if aws s3 cp \
              "s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}/steps/compose-qc/step-status.json" \
              step-status.json
            then
              break
            fi

            echo "Waiting for status.json..."
            sleep 10
          done

      - name: Validate status
        shell: bash
        run: |
          STATUS=$(jq -r .Status step-status.json)

          if [[ "$STATUS" != "Success" ]]; then
            echo "Simulation failed"
            cat step-status.json
            exit 1
          fi

      - name: Download artifacts from S3
        id: download-artifacts
        shell: bash
        run: |
          # Define a function to download required artifacts from S3 with retries
          download_required() {
            local base_s3_path="s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}"
            local source="$1"
            local destination="$2"
            mkdir -p "$(dirname "$destination")"

            for attempt in {1..10}; do  
              if aws s3 cp "${base_s3_path}/${source}" "$destination"; then
                test -s "$destination" && return 0
              fi
              echo "Waiting for $(basename "$destination")..."
              sleep 10
            done

            echo "::error::Required artifact was not available: $source"
            return 1
          }
          
          # Download transcript and compose-qc outputs for each scenario
          download_required "attempt-${{ github.run_attempt }}/transcript_compose-qc.log" "transcript_compose-qc.log"
          download_required "outputs/compose-qc/composeQc.json" "outputs/compose-qc/composeQc.json"

      - name: Upload artifacts to Github
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compose-qc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            step-status.json
            transcript_compose-qc.log
            outputs/compose-qc/composeQc.json
          if-no-files-found: error
          retention-days: 30

      - name: Add summary
        shell: bash
        run: |
          STATUS=$(jq -r .Status step-status.json)
          echo "## Compose QC task status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime (seconds): $(jq -r .RunTimeSeconds step-status.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $(jq -r .Status step-status.json)" >> $GITHUB_STEP_SUMMARY
          if [[ "$STATUS" != "Success" ]]; then
            echo "- Failure message: $(jq -r .FailureMessage step-status.json)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Compose QC results](${{ steps.upload-artifacts.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Included file: \`composeQc.json\`" >> "$GITHUB_STEP_SUMMARY"

  simulate:
    needs: [package-qc, compose-qc]
    if: ${{ inputs.simulate == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SIMULATION_ROLE_ARN }}
          aws-region: us-east-1
          # Keep credentials alive long enough for simulations to complete.
          # Otherwise, aws may throw ExpiredTokenException
          # Default role duration is 1 hour (3600 seconds)
          role-duration-seconds: 43200

      - name: resize server for simulation profile
        shell: bash
        run: |
          echo "Resizing server for simulation profile..."
          # Check the current AWS instance type
          instanceType=$(aws ec2 describe-instances \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].InstanceType" \
            --output text
          )
          echo "Current instance type: $instanceType"
          # Resize the instance if it doesn't match the desired simulation profile
          desiredInstanceType="${{ vars.EC2_INSTANCE_TYPE_LARGE }}"  # Replace with your desired instance type
          if [[ "$instanceType" != "$desiredInstanceType" ]]; then
            echo "Resizing instance to $desiredInstanceType..."
            aws ec2 modify-instance-attribute \
              --instance-id "${{ vars.SIMULATION_INSTANCE_ID }}" \
              --instance-type "{\"Value\": \"$desiredInstanceType\"}"
          fi
          # Wait a few seconds to allow the instance type change to take effect
          sleep 10 
          # Restart the instance to apply the new instance type
          aws ec2 reboot-instances \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}"
          # Wait until the instance is back online
          aws ec2 wait instance-status-ok \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}"

      - name: Send command to server
        id: sendCommand
        shell: bash
        run: |
          # The bootstrap script downloads the simulation script and then launches it.
          COMMAND="pwsh 'C:/DEER/deer-cloud-compute-setup/workflow/BootstrapSimulation.ps1'"
          COMMAND+=" -RunId '${{ github.run_id }}'"
          COMMAND+=" -Repository '${{ github.repository }}'"
          COMMAND+=" -CommitSha '${{ needs.package-qc.outputs.sha }}'"
          COMMAND+=" -MeasurePath '${{ inputs.measure_path }}'"
          COMMAND+=" -S3Bucket '${{ vars.SIMULATION_BUCKET }}'"
          COMMAND+=" -RunAttempt '${{ github.run_attempt }}'"
          COMMAND+=" -RequestedSteps 'simulate'"
          echo "COMMAND=$COMMAND"
          PARAMS=$(jq -nc --arg command "$COMMAND" '{commands:[$command]}')
          echo "PARAMS=$PARAMS"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "$PARAMS" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true,CloudWatchLogGroupName="/aws/ssm/githubactions" \
            --query 'Command.CommandId' \
            --output text \
            )
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "## Simulation task submitted" >> $GITHUB_STEP_SUMMARY
          echo "- SSM Command ID: $COMMAND_ID" >> $GITHUB_STEP_SUMMARY
          
      - name: Wait for commands to complete
        shell: bash
        run: |
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "${{ vars.SIMULATION_INSTANCE_ID }}" \
              --command-id "${{ steps.sendCommand.outputs.command_id }}" \
              --query "Status" \
              --output text)
            echo "Current status: $STATUS"
            if [[ "$STATUS" == "Failed" ]]; then
                echo "SSM command failed"
                exit 1
            fi
            if [[ "$STATUS" == "Cancelled" ]]; then
                echo "SSM command cancelled"
                exit 1
            fi
            if [[ "$STATUS" == "Success" ]]; then
                break
            fi
            sleep 30
          done

      - name: Download status file
        shell: bash
        run: |
          for i in {1..10}; do
            if aws s3 cp \
              "s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}/steps/simulate/step-status.json" \
              step-status.json
            then
              break
            fi

            echo "Waiting for status.json..."
            sleep 10
          done

      - name: Validate status
        shell: bash
        run: |
          STATUS=$(jq -r .Status step-status.json)

          if [[ "$STATUS" != "Success" ]]; then
            echo "Simulation failed"
            cat step-status.json
            exit 1
          fi

      - name: Download artifacts from S3
        id: download-artifacts
        shell: bash
        run: |
          # Define a function to download required artifacts from S3 with retries
          download_required() {
            local base_s3_path="s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}"
            local source="$1"
            local destination="$2"
            mkdir -p "$(dirname "$destination")"

            for attempt in {1..10}; do  
              if aws s3 cp "${base_s3_path}/${source}" "$destination"; then
                test -s "$destination" && return 0
              fi
              echo "Waiting for $(basename "$destination")..."
              sleep 10
            done

            echo "::error::Required artifact was not available: $source"
            return 1
          }
          # Download scenario-index.json from the package-qc step outputs
          download_required "outputs/package-qc/scenario-index.json" "scenario-index.json"

          # Download transcript and simulate outputs for each scenario
          download_required "attempt-${{ github.run_attempt }}/transcript_simulate.log" "transcript_simulate.log"

          # Iterate over scenarios from scenario index
          # Scenario index is just an unnamed list of dictionaries, each element representing a scenario with element scenarioId
          # scenarioId is a folder name that may include spaces.
          while IFS= read -r scenario; do
            echo "Processing scenario: $scenario"
            download_required "outputs/simulate/${scenario}/simulate.log" "outputs/simulate/${scenario}-simulate.log"
          done < <(jq -r '.[].scenarioId' scenario-index.json)

      - name: Upload artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: simulate-${{ github.run_id }}-${{github.run_attempt}}
          path: |
            step-status.json
            transcript_simulate.log
            outputs/*-simulate.log
          if-no-files-found: error
          retention-days: 30

      - name: Add summary
        shell: bash
        run: |
          STATUS=$(jq -r .Status step-status.json)
          echo "## Simulation task status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime (seconds): $(jq -r .RunTimeSeconds step-status.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $(jq -r .Status step-status.json)" >> $GITHUB_STEP_SUMMARY
          if [[ "$STATUS" != "Success" ]]; then
            echo "- Failure message: $(jq -r .FailureMessage step-status.json)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Simulation results](${{ steps.upload-artifacts.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Included file: \`transcript_simulate.log\` and \`outputs/simulate*.log\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resize server for normal profile
        shell: bash
        run: |
          echo "Resizing server for normal profile..."
          instanceType=$(aws ec2 describe-instances \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].InstanceType" \
            --output text)
          echo "Current instance type: $instanceType"
          desiredInstanceType="${{ vars.EC2_INSTANCE_TYPE_TEST }}"  # Replace with your desired instance type
          if [[ "$instanceType" != "$desiredInstanceType" ]]; then
            echo "Resizing instance to $desiredInstanceType..."
            aws ec2 modify-instance-attribute \
              --instance-id "${{ vars.SIMULATION_INSTANCE_ID }}" \
              --instance-type "{\"Value\": \"$desiredInstanceType\"}"
            sleep 10
            aws ec2 reboot-instances \
              --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}"
          fi
          # Wait until the instance is back online
          aws ec2 wait instance-status-ok \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}"

  collect:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Hello world!"

  calculate:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Hello world!"

  # This final job runs regardless of the success or failure of job1 and job2
  stop-cloud:
    needs: [calculate]
    if: ${{ always() && !inputs.keep_running }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SIMULATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Stop simulation instance
        run: |
          aws ec2 stop-instances \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}"
